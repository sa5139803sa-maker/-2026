name: Secret history scan

on:
  push:
    branches:
      - main
      - security/tenant-isolation-rls
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan tracked files and Git history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan pull request changes
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_VERSION: "8.24.3"

      - name: Scan complete Git history across all fetched refs
        shell: bash
        run: |
          gitleaks detect --source . --log-opts="--all" --redact --exit-code 2
