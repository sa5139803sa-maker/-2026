name: Secret history scan

on:
  push:
    branches:
      - main
      - security/tenant-isolation-rls
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan tracked files and Git history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan pull request changes
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_VERSION: "8.24.3"

      - name: Scan complete Git history across all fetched refs
        shell: bash
        run: |
          gitleaks detect --source . --log-opts="--all" --redact --exit-code 2
      - name: Extract the historical source archive
        shell: bash
        run: |
          archive_commit="112c8d9d78ca9c05e02ad8999acd5ae425464c89"
          archive_path="project-bolt-sb1-gvyvv9yd.zip"
          git cat-file -e "${archive_commit}:${archive_path}"
          git show "${archive_commit}:${archive_path}" > /tmp/water-management-historical.zip
          mkdir -p /tmp/water-management-historical
          unzip -q /tmp/water-management-historical.zip -d /tmp/water-management-historical
          test -n "$(find /tmp/water-management-historical -type f -print -quit)"

      - name: Classify historical environment credential safely
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "/tmp/water-management-historical/project/.env";
          if (!fs.existsSync(file)) {
            console.log("HISTORICAL_ENV_CLASSIFICATION", JSON.stringify({ exists: false }));
            process.exit(0);
          }

          const lines = fs.readFileSync(file, "utf8").split(/\r?\n/);
          const safeEntries = [];
          const unexpectedEntries = [];
          let totalJwtCandidates = 0;

          for (let index = 0; index < lines.length; index += 1) {
            const line = lines[index];
            const cleanLine = line.replace(/^\uFEFF/, "");
            const assignment = cleanLine.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$/);
            const variable = assignment?.[1] ?? "unparsed";
            const candidates = cleanLine.match(/[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/g) ?? [];
            totalJwtCandidates += candidates.length;

            for (const candidate of candidates) {
              let payload;
              try {
                payload = JSON.parse(Buffer.from(candidate.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"), "base64").toString("utf8"));
              } catch {
                unexpectedEntries.push({ variable, line: index + 1, reason: "unparseable_jwt" });
                continue;
              }

              const role = typeof payload.role === "string" ? payload.role : "absent";
              const issuerIsSupabase = typeof payload.iss === "string" && payload.iss.includes("supabase");
              const exp = Number(payload.exp);
              const expirationUtc = Number.isFinite(exp) ? new Date(exp * 1000).toISOString() : "absent";
              const expectedPublicAnon = variable === "EXPO_PUBLIC_SUPABASE_ANON_KEY" &&
                role === "anon" && issuerIsSupabase;

              const item = { variable, line: index + 1, role, issuerIsSupabase, expirationUtc };
              if (expectedPublicAnon) {
                safeEntries.push(item);
                lines[index] = lines[index].replace(candidate, "[REDACTED_PUBLIC_SUPABASE_ANON_KEY]");
              } else {
                unexpectedEntries.push({ ...item, reason: "not_expected_public_anon_key" });
              }
            }
          }

          fs.writeFileSync(file, lines.join("\n"), "utf8");
          console.log("HISTORICAL_ENV_CLASSIFICATION", JSON.stringify({
            totalJwtCandidates,
            recognizedPublicAnonEntries: safeEntries,
            unexpectedEntries,
            sanitizedPublicAnonValues: safeEntries.length,
          }));

          if (safeEntries.length !== 1 || unexpectedEntries.length !== 0) {
            console.error("Historical .env contains an unexpected or unclassified JWT; archive scan must remain blocked.");
            process.exit(2);
          }
          NODE

      - name: Scan extracted historical archive
        shell: bash
        run: |
          set +e
          gitleaks detect --no-git --source /tmp/water-management-historical --config .gitleaks.toml --redact --report-format sarif --report-path /tmp/water-management-archive.sarif --exit-code 2
          scan_status=$?
          set -e

          node <<'NODE'
          const fs = require("node:fs");
          const reportPath = "/tmp/water-management-archive.sarif";
          if (!fs.existsSync(reportPath)) {
            console.error("ARCHIVE_SCAN_REPORT_MISSING");
            process.exit(3);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const findings = (report.runs ?? []).flatMap((run) =>
            (run.results ?? []).map((result) => ({
              ruleId: result.ruleId ?? "unknown",
              file: result.locations?.[0]?.physicalLocation?.artifactLocation?.uri ?? "unknown",
              line: result.locations?.[0]?.physicalLocation?.region?.startLine ?? null,
            }))
          );
          console.log("ARCHIVE_SCAN_FINDINGS", JSON.stringify({
            count: findings.length,
            findings,
          }));
          NODE

          exit "$scan_status"
