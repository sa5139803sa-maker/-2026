name: Supabase tenant isolation tests

on:
  push:
    branches:
      - security/tenant-isolation-rls
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tenant-isolation:
    name: PostgreSQL RLS and tenant boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Run migration and RLS integration suite
        run: |
          psql --version
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --set PERSIST_CONCURRENCY_FIXTURES=1 --file supabase/tests/rls/tenant_isolation.sql
      - name: Run genuine two-session daily report concurrency test
        run: bash supabase/tests/concurrency/run.sh
