name: Web console checks

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "supabase/functions/manage-accounts/**"
      - "supabase/migrations/**"
      - "supabase/tests/rls/tenant_isolation.sql"
      - ".github/workflows/web-console.yml"
  push:
    branches:
      - security/tenant-isolation-rls
    paths:
      - "apps/web/**"
      - "supabase/functions/manage-accounts/**"
      - "supabase/migrations/**"
      - "supabase/tests/rls/tenant_isolation.sql"
      - ".github/workflows/web-console.yml"

permissions:
  contents: read

concurrency:
  group: web-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Next.js typecheck, tests, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Unit tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"