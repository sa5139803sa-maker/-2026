name: Android timer notification validation

on:
  push:
    branches:
      - feature/android-timer-alerts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-timer-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native-build:
    name: Android config, tests, and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Verify local PumpTimer module autolinking
        shell: bash
        run: |
          set -o pipefail
          npx expo-modules-autolinking resolve --platform android | tee /tmp/expo-android-modules.txt
          if ! grep --fixed-strings --quiet "expo.modules.pumptimer.PumpTimerModule" /tmp/expo-android-modules.txt; then
            echo "Local PumpTimer native module was not autolinked for Android."
            exit 1
          fi
          echo "PumpTimer native module autolinking verified."

      - name: Verify Android foreground-service manifest
        shell: bash
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          for required in \
            "android.permission.FOREGROUND_SERVICE" \
            "android.permission.FOREGROUND_SERVICE_SPECIAL_USE" \
            "expo.modules.pumptimer.PumpTimerForegroundService" \
            'android:foregroundServiceType="specialUse"' \
            "android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"; do
            if ! grep --fixed-strings --quiet "$required" "$manifest"; then
              echo "Required foreground-service manifest entry missing: $required"
              exit 1
            fi
          done
          echo "Android special-use foreground-service manifest verified."

      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK for physical-device verification
        uses: actions/upload-artifact@v4
        with:
          name: android-pump-timer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
